<title>Science Quest 7 · Designed by Mr. Agurto 2026</title>

<style>
:root{--ink:#2d3436;--ok:#00b894;--bad:#ff7675;--gold:#fdcb6e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#a29bfe,#74b9ff 50%,#81ecec);background-attachment:fixed;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.title{font-family:'Baloo 2',Nunito,sans-serif;margin:.2em 0;line-height:1.15}
#credit{position:sticky;top:0;z-index:60;text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;color:#fff;background:linear-gradient(90deg,#ff6b6b,#feca57,#1dd1a1,#54a0ff,#5f27cd,#ff6b6b);background-size:300% 100%;animation:slide 10s linear infinite;padding:6px 10px;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.4);font-size:15px}
@keyframes slide{to{background-position:300% 0}}
#app{max-width:920px;margin:0 auto;padding:12px 16px 70px}
#app.enter>*{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.topnav{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:18px;padding:8px 10px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.navtitle{flex:1;font-family:'Baloo 2';font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{border:0;background:#f1f2f6;border-radius:12px;font-size:20px;width:42px;height:42px;cursor:pointer;flex:none}
.navbtn:active,.btn:active,.opt:active,.bin:active,.act:active{transform:scale(.95)}
.chip{border:0;background:#ffeaa7;border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit;color:var(--ink)}
.chip.lvl{background:#dfe6e9}
.panel{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.12);margin-bottom:16px}
.center{text-align:center}
.btn{border:0;border-radius:16px;padding:12px 20px;font-size:17px;font-weight:800;font-family:'Baloo 2',sans-serif;background:#6c5ce7;color:#fff;cursor:pointer;box-shadow:0 5px 0 #4834d4;transition:transform .1s;margin:6px}
.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:#fff;color:#6c5ce7;box-shadow:0 5px 0 #c8c2f5}
.btn.green{background:#00b894;box-shadow:0 5px 0 #00876c}
.btn.big{font-size:21px;padding:14px 28px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:10px 0}
.inp{width:100%;max-width:340px;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid #dfe6e9;font-family:inherit;outline:none;text-align:center}
.inp:focus{border-color:#6c5ce7}
.lbl{display:block;font-weight:800;margin:16px 0 8px}
.bigemoji{font-size:64px;line-height:1}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.spin{animation:spin 1s ease}
@keyframes spin{from{transform:rotate(-180deg) scale(.2)}to{transform:none}}
.pop-in{animation:popin .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.avatars{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px;margin:0 auto}
.av{font-size:30px;width:54px;height:54px;border-radius:16px;border:3px solid transparent;background:#f1f2f6;cursor:pointer}
.av.sel{border-color:#6c5ce7;background:#e8e4ff;transform:scale(1.1)}
/* home */
.hero{display:flex;gap:16px;align-items:center;background:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.12);margin-bottom:14px}
.avatar{background:linear-gradient(135deg,#ffeaa7,#fab1a0);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.avatar.big{width:76px;height:76px;font-size:44px}
.hero h1{font-size:28px}
.rank{font-weight:800;color:#6c5ce7}
.xpbar{height:16px;background:#dfe6e9;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.xpbar div{height:100%;background:linear-gradient(90deg,#fdcb6e,#e17055);border-radius:99px;transition:width .6s}
.lightning{display:block;width:100%;border:0;border-radius:22px;padding:16px;font-size:24px;font-family:'Baloo 2';font-weight:800;color:#fff;background:linear-gradient(90deg,#fd79a8,#e17055,#fdcb6e);cursor:pointer;box-shadow:0 6px 0 #c0392b;margin-bottom:16px;animation:glow 2s ease-in-out infinite}
.lightning small{display:block;font-size:14px;font-family:Nunito;opacity:.95}
@keyframes glow{50%{filter:brightness(1.12)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.utile{border:0;text-align:left;border-radius:22px;padding:18px;color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.15);transition:transform .15s;font-family:inherit}
.utile:hover{transform:translateY(-4px) rotate(-.5deg)}
.utile .ue{font-size:46px;position:absolute;right:12px;top:8px;opacity:.9}
.utile h3{font-size:22px;margin-right:56px}
.utile .stars{font-size:18px;letter-spacing:2px}
.ubar{height:8px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:8px;overflow:hidden}
.ubar div{height:100%;background:#fff;border-radius:9px}
/* unit */
.unithero{display:flex;gap:16px;align-items:center;color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.unithero h1{font-size:28px}
.stars{font-size:22px;letter-spacing:3px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.act{border:0;background:#fff;border-radius:20px;padding:18px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 #dfe6e9;position:relative;font-family:inherit;color:var(--ink);font-size:17px;transition:transform .12s}
.act:hover{transform:translateY(-3px)}
.act .ae{font-size:40px}
.act small{color:#636e72;text-align:center}
.act.done{box-shadow:0 6px 0 #fdcb6e;background:#fffbea}
.tick{position:absolute;top:6px;right:10px}
/* learn */
.counter{text-align:center;color:#fff;font-weight:800;margin-bottom:8px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.card3d{perspective:1100px;width:100%;max-width:540px;height:320px;margin:0 auto;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card3d.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.2)}
.front{color:#fff}
.front h2{font-size:30px}
.front .cemoji{font-size:80px}
.back{background:#fff;transform:rotateY(180deg);font-size:19px;line-height:1.5;overflow:auto}
.back h3{font-size:22px;margin-bottom:8px}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:14px 0}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.5)}
.dot.seen{background:#fff}
.dot.cur{background:#fdcb6e;transform:scale(1.3)}
/* quiz */
.qhead{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}
.streak.hot{color:#e17055;animation:bounce .8s infinite}
.prog{height:12px;background:#dfe6e9;border-radius:9px;overflow:hidden;margin:6px 0 10px}
.prog div{height:100%;background:linear-gradient(90deg,#00cec9,#6c5ce7);transition:width .4s}
.q{font-size:23px;margin:10px 0 16px}
.opts{display:grid;gap:10px}
.opt{border:3px solid #dfe6e9;background:#fff;border-radius:16px;padding:14px 16px;font-size:18px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:700;transition:transform .1s,background .2s}
.opt:hover:not(:disabled){border-color:#a29bfe;background:#f5f3ff}
.opt.right{background:#55efc4;border-color:#00b894}
.opt.wrong{background:#fab1a0;border-color:#e17055;animation:shake .4s}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:14px;border-radius:16px;font-weight:800;font-size:19px;text-align:center;animation:popin .35s both}
.fb.ok{background:#dffff4;color:#00876c}
.fb.no{background:#ffeceb;color:#c0392b}
.fb p{font-weight:600;font-size:16px;color:var(--ink);margin:6px 0}
.tag{display:inline-block;color:#fff;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px}
/* sort */
.sorttitle{font-weight:800;font-size:18px;color:#6c5ce7}
.sortitem{font-size:24px;font-weight:800;background:#fff7d6;border:3px dashed #fdcb6e;border-radius:20px;padding:24px 16px;margin:10px auto 18px;max-width:480px;font-family:'Baloo 2'}
.sortitem.flyok{animation:fly .6s forwards}
@keyframes fly{to{transform:translateY(70px) scale(.3);opacity:0}}
.bins{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.bins.b3{grid-template-columns:repeat(3,1fr)}
.bin{border:0;border-radius:18px;padding:18px 8px;font-size:18px;font-weight:800;color:#fff;background:var(--c);cursor:pointer;font-family:'Baloo 2';box-shadow:0 5px 0 rgba(0,0,0,.18)}
.bin.right{outline:5px solid #00b894}
.bin.wrong{animation:shake .4s;opacity:.5}
.bin.hint{outline:5px dashed #00b894;animation:bounce .6s 2}
@media(max-width:480px){.bins.b3{grid-template-columns:1fr}}
/* match */
.mhead{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:15px;margin-bottom:12px;flex-wrap:wrap}
.mcols{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.mcols>div{display:flex;flex-direction:column;gap:8px}
.mbtn{border:3px solid #dfe6e9;background:#fff;border-radius:14px;padding:12px 8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);min-height:58px;transition:all .2s}
.mbtn.L{background:#f5f3ff;font-weight:800}
.mbtn.sel{border-color:#6c5ce7;background:#e8e4ff;transform:scale(1.04)}
.mbtn.ok{border-color:#00b894;background:#55efc4;opacity:.75;cursor:default;transform:scale(.97)}
.mbtn.no{border-color:#e17055;background:#fab1a0;animation:shake .4s}
/* calc */
.calcstats{font-weight:700;color:#636e72}
.calcq{font-size:19px;margin:10px 0}
.calcq .ask{font-size:22px;font-weight:800;color:#6c5ce7}
.calcin{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.inp.num{max-width:170px;font-size:24px;font-weight:800}
.unit{font-weight:800;font-size:20px}
.hint{margin:14px auto;max-width:460px;background:#fffbea;border-radius:14px;padding:10px;text-align:left}
.hint summary{cursor:pointer;font-weight:800}
.nuc{display:inline-flex;align-items:center;font-size:54px;font-weight:800;font-family:'Baloo 2';margin:0 14px}
.nuc .ls{display:inline-flex;flex-direction:column;font-size:.42em;line-height:1.05;text-align:right;margin-right:3px;color:#6c5ce7}
.nuc .chg{font-size:.42em;align-self:flex-start;color:#e17055;margin-left:2px}
/* lightning */
.lhead{display:flex;justify-content:space-between;align-items:center;color:#fff;font-family:'Baloo 2';font-weight:800;font-size:30px;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.bar{height:14px;background:rgba(255,255,255,.4);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar div{height:100%;background:linear-gradient(90deg,#fdcb6e,#e17055);width:100%}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:#fff;border-radius:20px;padding:14px 10px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.1)}
.badge .be{font-size:46px;display:block}
.badge.locked .be{filter:grayscale(1);opacity:.35}
.badge.locked{background:#f1f2f6}
.badge b{display:block;font-family:'Baloo 2';font-size:17px}
.badge small{color:#636e72}
/* report */
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid #dfe6e9;text-align:center}
th{background:#f5f3ff}
td:first-child,th:first-child{text-align:left}
.rephead{display:flex;gap:14px;align-items:center}
.tablewrap{overflow-x:auto}
textarea{width:100%;min-height:90px;border-radius:14px;border:3px solid #dfe6e9;padding:10px;font-family:monospace;font-size:12px}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(45,52,54,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.popcard{background:#fff;border-radius:28px;padding:26px;text-align:center;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.popcard .bigemoji{font-size:84px}
#toasts{position:fixed;top:44px;right:12px;z-index:150;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{background:#2d3436;color:#fff;font-weight:800;padding:8px 14px;border-radius:99px;animation:toast 1.6s forwards;font-size:15px}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:300;border-radius:2px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(760deg)}}
.utile.lock{filter:grayscale(1);opacity:.6}.utile small{display:block;margin-top:6px;font-weight:700}
.result .bigemoji{font-size:90px}
.big3{font-size:44px;letter-spacing:6px}
@media(max-width:560px){
 .navtitle{font-size:15px}.chip{font-size:12px;padding:6px 8px}
 .hero h1,.unithero h1{font-size:23px}.q{font-size:20px}.opt{font-size:16px}
 .card3d{height:300px}.front h2{font-size:25px}.back{font-size:17px}
 .mcols{grid-template-columns:1fr 1.3fr}.mbtn{font-size:13px;padding:10px 6px}
 .nuc{font-size:44px}
}
@media print{
 body{background:#fff}.topnav,.noprint{display:none!important}
 .panel{box-shadow:none}#credit{position:static;color:#000;text-shadow:none;background:#fff;animation:none}
}
</style>
</head>

{id:'virus',name:'Viruses: Alive or Not?',short:'Viruses',emoji:'🧫',color:'#d63031',
 blurb:'Virus structure, how they replicate, and why they are not living organisms.',calc:null,
 cards:[
  ['🦠','What is a Virus?','A tiny infectious particle, about <b>20–300 nm</b>: far smaller than bacteria. You need an <b>electron microscope</b> to see one.'],
  ['🧱','Virus Structure','<b>Genetic material</b> (DNA or RNA) inside a protein coat called the <b>capsid</b>. Some also have a fatty <b>envelope</b>.'],
  ['🔑','Hijacking a Host','A virus can only reproduce <b>inside a host cell</b>. It uses the host’s ribosomes and energy.'],
  ['🔁','Lytic Cycle','1️⃣ Attach 2️⃣ Inject genetic material 3️⃣ Host copies viral parts 4️⃣ Assemble 5️⃣ Cell <b>bursts (lysis)</b> and new viruses escape.'],
  ['❌','Not Made of Cells','No cell membrane, cytoplasm or organelles. <b>Cell theory</b> says living things are made of cells, so viruses break the first rule.'],
  ['🚫','No Metabolism','Viruses do not respire, grow, use energy or keep homeostasis. Outside a host they are <b>inactive particles</b>.'],
  ['⚖️','Why NOT Living?','They fail the checklist: <b>no cells, no metabolism, no growth, no homeostasis, cannot reproduce alone</b>. They do have DNA/RNA and can mutate, so some call them “on the edge of life”.'],

const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- sound & fx ---------- */
let AC=null;
function tone(f,d=.12,type='sine',delay=0){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={good(){tone(660);tone(880,.15,'sine',.09)},bad(){tone(170,.25,'square')},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.11))},flip(){tone(480,.05,'triangle')}};
function confetti(n=70){const cols=['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#a29bfe','#ff9ff3'];for(let i=0;i<n;i++){const p=document.createElement('i');p.className='conf';p.style.left=Math.random()*100+'vw';p.style.background=cols[i%6];p.style.setProperty('--dx',(Math.random()*240-120)+'px');p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),3800)}}

 if(level()>before){sfx.win();confetti();popup(`<div class="bigemoji spin">🆙</div><h2>LEVEL UP!</h2><h3>Level ${level()}</h3><p>You are now a <b>${rankTitle()}</b>!</p>`,'Let’s go! 🚀')}

  if(t===0)return {html:`<p>A block has mass <b>${m} g</b> and volume <b>${V} cm³</b>.</p><p class="ask">What is its density?</p>`,a:d,unit:'g/cm³',sol:`ρ = m ÷ V = ${m} ÷ ${V} = <b>${d} g/cm³</b>`,hint:'Density = mass ÷ volume'}
  if(t===1)return {html:`<p>A metal has density <b>${d} g/cm³</b> and volume <b>${V} cm³</b>.</p><p class="ask">What is its mass?</p>`,a:m,unit:'g',sol:`m = ρ × V = ${d} × ${V} = <b>${m} g</b>`,hint:'Mass = density × volume'}
  return {html:`<p>A liquid has density <b>${d} g/cm³</b> and mass <b>${m} g</b>.</p><p class="ask">What is its volume?</p>`,a:V,unit:'cm³',sol:`V = m ÷ ρ = ${m} ÷ ${d} = <b>${V} cm³</b>`,hint:'Volume = mass ÷ density'}}}};
const PH2=()=>{switch(rnd(0,7)){
 case 0:{const v=rnd(2,15),t=rnd(2,20),d=v*t,k=rnd(0,2);const o=[[`<b>${d} m</b> in <b>${t} s</b>`,'speed',v,'m/s',`v = d ÷ t = ${d} ÷ ${t} = <b>${v} m/s</b>`,'v = d ÷ t'],[`at <b>${v} m/s</b> for <b>${t} s</b>`,'distance',d,'m',`d = v × t = ${v} × ${t} = <b>${d} m</b>`,'d = v × t'],[`<b>${d} m</b> at <b>${v} m/s</b>`,'time taken',t,'s',`t = d ÷ v = ${d} ÷ ${v} = <b>${t} s</b>`,'t = d ÷ v']][k];return {html:`<p>🚴 A cyclist travels ${o[0]}.</p><p class="ask">Find the ${o[1]}.</p>`,a:o[2],unit:o[3],sol:o[4],hint:o[5]}}
 case 1:{const m=rnd(2,80);return {html:`<p>🌍 A student has a mass of <b>${m} kg</b> (g = 10 N/kg).</p><p class="ask">What is the weight?</p>`,a:m*10,unit:'N',sol:`W = m × g = ${m} × 10 = <b>${m*10} N</b>`,hint:'Weight = mass × g'}}
 case 2:{const A=rnd(2,10),P=rnd(2,40)*10,F=A*P;return {html:`<p>A force of <b>${F} N</b> acts on an area of <b>${A} m²</b>.</p><p class="ask">What is the pressure?</p>`,a:P,unit:'Pa',sol:`P = F ÷ A = ${F} ÷ ${A} = <b>${P} Pa</b>`,hint:'Pressure = force ÷ area'}}
 case 3:{const P=rnd(2,30)*10,t=rnd(2,20),W=P*t;return {html:`<p>⚙️ A motor does <b>${W} J</b> of work in <b>${t} s</b>.</p><p class="ask">What is its power?</p>`,a:P,unit:'W',sol:`Power = work ÷ time = ${W} ÷ ${t} = <b>${P} W</b>`,hint:'Power = work ÷ time'}}
 case 4:{const m=rnd(1,20),a=rnd(1,10);return {html:`<p>🚀 A <b>${m} kg</b> trolley accelerates at <b>${a} m/s²</b>.</p><p class="ask">What force acts on it?</p>`,a:m*a,unit:'N',sol:`F = m × a = ${m} × ${a} = <b>${m*a} N</b>`,hint:'F = m × a'}}
 case 5:{const e=rnd(2,20)*10,ma=pick([2,3,4,5,10]),L=e*ma;return {html:`<p>🏗️ A machine lifts a load of <b>${L} N</b> using an effort of <b>${e} N</b>.</p><p class="ask">What is the mechanical advantage?</p>`,a:ma,sol:`MA = load ÷ effort = ${L} ÷ ${e} = <b>${ma}</b>`,hint:'Mechanical advantage = load ÷ effort'}}
 case 6:{const h=pick([5,20,45,80]),v=Math.sqrt(20*h);return {html:`<p>🎾 A ball falls <b>${h} m</b> from rest (g = 10 N/kg, no air resistance).</p><p class="ask">How fast is it moving just before landing?</p>`,a:v,unit:'m/s',sol:`PE → KE: g×h = ½v² → v = √(2 × 10 × ${h}) = √${20*h} = <b>${v} m/s</b>`,hint:'All PE becomes KE: m×g×h = ½×m×v², so v = √(2gh)'}}
 default:{const m=rnd(1,10),h=rnd(2,20);return {html:`<p>🍎 A <b>${m} kg</b> object falls from <b>${h} m</b> (g = 10 N/kg).</p><p class="ask">How much kinetic energy does it have just before landing?</p>`,a:m*10*h,unit:'J',sol:`Energy is conserved: KE = PE = ${m} × 10 × ${h} = <b>${m*10*h} J</b>`,hint:'KE at the bottom = PE at the top'}}}};
const _gc=GEN.chem,_gp=GEN.phys;GEN.chem=()=>Math.random()<.5?CH2():_gc();GEN.phys=()=>Math.random()<.6?PH2():_gp();

/* ---------- heroes ---------- */
const CHARS=[
 ['🧙','Wizard Wally','Reach Level 3',()=>level()>=3],
 ['🦄','Quantum Unicorn','Reach Level 7',()=>level()>=7],
 ['🥼','Dr. Variable','Defeat Dr. Zero-Control',()=>S.bosses.b1,'b1'],
 ['🧑‍🚀','Astro Atom','Defeat Atom Smasher',()=>S.bosses.b2,'b2'],
 ['🦾','Kinetic Kid','Defeat Colonel Friction',()=>S.bosses.b3,'b3'],
 ['🧝','Cellina','Defeat Zombie Cell',()=>S.bosses.b4,'b4'],
 ['🐉','Eco Dragon','Defeat Toxi-Pest',()=>S.bosses.b5,'b5'],
 ['🦸','Captain Immunity','Defeat the Virus King',()=>S.bosses.b6,'b6']];
function avList(){return AVATARS.concat(CHARS.filter(c=>S.chars[c[0]]).map(c=>c[0]))}
function checkChars(){let n=0;CHARS.forEach(c=>{if(!S.chars[c[0]]&&c[3]()){S.chars[c[0]]=1;n++;popup(`<div class="bigemoji spin">${c[0]}</div><h2>Hero unlocked!</h2><h3>${c[1]}</h3><p>Equip it in 🦸 Heroes or ⚙️ Profile.</p>`,'Cool! 😎')}});if(n){save();sfx.win()}}
SCREENS.heroes=()=>nav('🦸 Heroes')+`<div class="panel center"><h1>🦸 Hall of Heroes</h1><p>${Object.keys(S.chars).length} / ${CHARS.length} unlocked</p></div><div class="bgrid">${CHARS.map(c=>{const on=S.chars[c[0]];return `<div class="badge ${on?'':'locked'}"><span class="be">${c[0]}</span><b>${on?c[1]:'???'}</b><small>${on?'':'🔒 '+c[2]}</small>${on?`<button class="btn" style="font-size:14px;padding:6px 12px;margin:6px 0 0" onclick="S.avatar='${c[0]}';save();toast('Hero equipped! ✅');go('heroes')">${S.avatar===c[0]?'✔ Equipped':'Use'}</button>`:''}</div>`}).join('')}</div>`;

/* ---------- bosses ---------- */
const BOSSES=[
 {id:'b1',e:'👹',name:'Dr. Zero-Control',u:['method'],c:'#6c5ce7',intro:'Changes ALL the variables at once!'},
 {id:'b2',e:'💣',name:'Atom Smasher',u:['chem'],c:'#00a8a8',intro:'Scrambles protons, neutrons and electrons.'},
 {id:'b3',e:'🗿',name:'Colonel Friction',u:['phys'],c:'#e67e22',intro:'Steals energy and wastes it as heat.'},
 {id:'b4',e:'🧟',name:'Zombie Cell',u:['life','cells'],c:'#e84393',intro:'Breaks cell theory with undead organelles.'},
 {id:'b5',e:'🐛',name:'Toxi-Pest',u:['eco'],c:'#27ae60',intro:'Wrecks food webs and biomes.'},
 {id:'b6',e:'👾',name:'The Virus King',u:[],c:'#d63031',intro:'Hijacks cells. Questions from EVERY unit!'}];
const bossOK=b=>b.id==='b6'?BOSSES.slice(0,5).every(x=>S.bosses[x.id])&&U('virus').best>=60:b.u.every(i=>U(i).best>=60);
const bossNeed=b=>b.id==='b6'?'Defeat the other 5 bosses and score 60%+ in Viruses':'Score 60%+ in the quiz: '+b.u.map(i=>UN[i].short).join(' + ');
function bossQ(ids){const u=UN[pick(ids)];
 if(u.calc&&Math.random()<.5){const c=GEN[u.calc]();let o;
  if(c.choices)o=c.choices.map((t,k)=>({t,ok:k===c.a}));
  else{const a=c.a,s=new Set([a]);while(s.size<4)s.add(+(a+pick([-1,1])*rnd(1,Math.max(3,Math.round(Math.abs(a)*.4)))).toFixed(2));o=[...s].map(v=>({t:v+(c.unit?' '+c.unit:''),ok:v===a}))}
  return {q:c.html,e:c.sol,opts:shuffle(o)}}
 return prep(pick(u.quiz))}
let BT=null;
function startBoss(id){const b=BOSSES.find(x=>x.id===id);if(!bossOK(b))return;const hp=id==='b6'?10:8;
 BT={b,hp,max:hp,hearts:3,i:0,lock:false,qs:Array.from({length:hp+2},()=>bossQ(id==='b6'?UNITS.map(u=>u.id):b.u))};go('bplay')}
SCREENS.bosses=()=>nav('⚔️ Boss Arena')+`<div class="panel center"><h1>⚔️ Boss Arena</h1><p>Every correct answer damages the boss. Lose 3 hearts and you retreat. Bosses mix quiz questions with physics and chemistry problems!</p></div><div class="grid">${BOSSES.map(b=>{const ok=bossOK(b),d=S.bosses[b.id];return `<button class="utile ${ok?'':'lock'}" style="background:${b.c}" onclick="${ok?`startBoss('${b.id}')`:`toast('🔒 Not yet!')`}"><span class="ue">${ok?b.e:'🔒'}</span><h3>${b.name}</h3><small>${d?'✅ Defeated':ok?b.intro:bossNeed(b)}</small></button>`}).join('')}</div>`;
SCREENS.bplay=()=>{const b=BT.b,q=BT.qs[BT.i];
 return nav('⚔️ '+b.name)+`<div class="panel center"><div class="bigemoji ${BT.hit?'shake':'bounce'}" style="font-size:84px">${b.e}</div><h2>${b.name}</h2><div class="bar" style="background:#dfe6e9"><div style="width:${BT.hp/BT.max*100}%;background:linear-gradient(90deg,#ff7675,#d63031)"></div></div><b>Boss HP ${BT.hp}/${BT.max}</b> · You: ${'💚'.repeat(BT.hearts)}${'🖤'.repeat(3-BT.hearts)}
 <div class="calcq">${q.q}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt" onclick="bAns(${k})">${o.t}</button>`).join('')}</div><div id="fb"></div></div>`};
function bAns(k){if(BT.lock)return;BT.lock=true;const q=BT.qs[BT.i],bs=document.querySelectorAll('.opt'),ok=q.opts[k].ok;
 bs.forEach((x,j)=>{x.disabled=true;if(q.opts[j].ok)x.classList.add('right')});
 if(ok){BT.hp--;sfx.good()}else{BT.hearts--;bs[k].classList.add('wrong');sfx.bad()}
 const end=BT.hp<=0||BT.hearts<=0;
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'💥 Direct hit!':'💔 The boss strikes!'}${q.e?`<p>💡 ${q.e}</p>`:''}<button class="btn" onclick="bNext()">${end?'Continue ⚔️':'Next ➡'}</button></div>`}
function bNext(){if(BT.hp<=0)return bossWin();if(BT.hearts<=0){S.acts++;save();sfx.bad();return go('bend',false)}BT.i++;BT.lock=false;go('bplay')}
function bossWin(){const id=BT.b.id,first=!S.bosses[id];S.bosses[id]=Date.now();S.acts++;save();confetti(120);sfx.win();go('bend',true);addXP(first?(id==='b6'?100:40):10)}
SCREENS.bend=win=>{const b=BT.b,ch=CHARS.find(c=>c[4]===b.id);
 return nav('⚔️ '+b.name)+`<div class="panel center result"><div class="bigemoji pop-in">${win?'🏆':b.e}</div><h1>${win?'Boss defeated!':'The boss escaped…'}</h1><p>${win?(ch?`Hero reward: <b>${ch[0]} ${ch[1]}</b>`:''):'Review the cards and try again. You can do it!'}</p><div class="row"><button class="btn" onclick="startBoss('${b.id}')">🔁 Fight again</button><button class="btn green" onclick="go('bosses')">Boss Arena</button></div></div>`};
BADGES.push(['boss1','⚔️','Boss Hunter','Defeat your first boss',()=>Object.keys(S.bosses).length>=1],['boss6','🏰','Boss Slayer','Defeat all 6 bosses',()=>Object.keys(S.bosses).length>=BOSSES.length],['virus5','🧫','Virus Expert','Score 100% in the Viruses quiz',()=>U('virus').best>=100]);

/* ---------- start ---------- */
go(S.name?'home':'welcome');
checkBadges();
</script>
